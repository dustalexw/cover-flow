name: Build

# Builds the universal app and runs the tests on macOS. Pushing a v* tag also
# attaches the zipped app to a draft GitHub release for that tag.
on:
  push:
    branches: [main, "release-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

permissions:
  contents: write

defaults:
  run:
    # Explicit bash enables pipefail, so a failing `swift test | tee` fails the step.
    shell: bash

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Xcode
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version

      - name: Show toolchain
        run: |
          sw_vers
          xcrun swift --version

      - name: Restore downloaded dependencies and model
        id: vendor-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build/vendor/*.tar.gz
            .build/vendor/*.tar.xz
            .build/vendor/ffmpeg-install-universal
            .build/vendor/stable-diffusion-model
            .build/vendor/karaoke-runtime
          key: vendor-xcode16.4-${{ runner.arch }}-${{ hashFiles('scripts/build-visualizer.sh', 'scripts/build-tags.sh', 'scripts/build-ffmpeg.sh', 'scripts/verify-audio-runtime.sh', 'scripts/fetch-sd-model.sh', 'scripts/build-karaoke-runtime.sh', 'Resources/Karaoke/runtime-lock.txt') }}
          restore-keys: |
            vendor-

      - name: Build app
        run: |
          bash build.command --no-launch || { echo "::group::build.log"; cat build.log; echo "::endgroup::"; exit 1; }

      - name: Verify decoder runtime
        run: bash scripts/verify-audio-runtime.sh .build/vendor/ffmpeg-install-universal

      # Successful dependency builds survive a later test failure; retrying a
      # product regression should not rebuild the verified native libraries.
      - name: Save verified dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build/vendor/*.tar.gz
            .build/vendor/*.tar.xz
            .build/vendor/ffmpeg-install-universal
            .build/vendor/stable-diffusion-model
            .build/vendor/karaoke-runtime
          key: ${{ steps.vendor-cache.outputs.cache-primary-key }}

      - name: Run tests
        env:
          KARAOKE_TEST_RESOURCES: ${{ github.workspace }}/Cover Flow.app/Contents/Resources
        # ArtworkTagWriterTests are skipped here only: on GitHub's macOS runner the
        # system metadata reader returns no MP3/WAV tags, so they fail even on the
        # unmodified 1.3.0 code. Run them locally before releasing.
        run: |
          xcrun swift test -c release --skip ArtworkTagWriterTests 2>&1 | tee test.log

      - name: Stress-test native decoder ownership
        run: bash scripts/test-decoder-stress.sh 2>&1 | tee decoder-stress.log

      - name: Test karaoke processor
        run: |
          PYTHONPATH="$PWD/Cover Flow.app/Contents/Resources/KaraokeRuntime/site-packages" \
            "Cover Flow.app/Contents/Resources/KaraokeRuntime/python/bin/python3" \
            -B -m unittest discover -s Tests/Karaoke -v
          codesign --verify --deep --strict "Cover Flow.app"

      - name: Report test failures
        if: failure()
        run: |
          # Surface compiler errors and failing tests as annotations, which stay
          # readable through the API even where raw logs are not.
          set +eo pipefail   # grep finding nothing must not end this step
          for log in build.log test.log; do
            [ -f "$log" ] || continue
            summary=$(grep -E "error:|: error|failed|Executed [0-9]+ tests|Fatal error|Test Case .* (failed|crashed)" "$log" | head -60 | cut -c1-400)
            [ -n "$summary" ] || summary=$(tail -40 "$log" | cut -c1-400)
            escaped=$(printf '%s' "$summary" | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"), end="")')
            echo "::error title=$log::$escaped"
          done

      - name: Package app
        id: package
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "Cover Flow.app/Contents/Info.plist")
          ZIP="Cover-Flow-$VERSION-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "Cover Flow.app" "$ZIP"
          ls -lh "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
            decoder-stress.log
          if-no-files-found: ignore

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v${{ steps.package.outputs.version }}" ]; then
            echo "Tag $TAG does not match app version ${{ steps.package.outputs.version }}" >&2
            exit 1
          fi
          if PUBLISHED=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            if [ "$PUBLISHED" = "false" ]; then
              echo "Release is already published; preserving its verified download and checksums."
              exit 0
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "Cover Flow ${{ steps.package.outputs.version }}" --notes "Draft"
          fi
          gh release upload "$TAG" "${{ steps.package.outputs.zip }}" --clobber
