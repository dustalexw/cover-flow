name: iPadOS
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'iPad/**'
      - 'Sources/CoverFlow/Playback/**'
      - 'Sources/CoverFlow/Model/**'
      - 'Sources/CoverFlow/Lyrics/**'
      - 'Sources/CoverFlow/Scrobbling/**'
      - 'Sources/CoverFlow/Library/MetadataReader.swift'
      - 'Sources/CoverFlow/Library/OggOpus.swift'
      - 'scripts/*ipad*'
      - 'build-ipad.command'
      - '.github/workflows/ipados.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Xcode
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version
      - uses: actions/cache@v4
        with:
          path: |
            .build/vendor/ipados
            iPad/Vendor
          key: ipad-runtime-xcode16.4-${{ runner.arch }}-${{ hashFiles('scripts/fetch-ipad-runtime.sh') }}
      - name: Prepare native runtime
        run: bash scripts/fetch-ipad-runtime.sh
      - name: Verify processing core
        run: swift test --package-path iPad --disable-sandbox
      - name: Build for iPad
        run: bash build-ipad.command --device
      - name: Build for Simulator
        run: bash build-ipad.command --simulator
